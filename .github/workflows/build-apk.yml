name: Build Android APK

on:
  push:
    branches: [ main, master ]
    # Yard schema saves from the app only touch data files - no need to rebuild the APK
    paths-ignore:
      - 'yards/**'
      - 'database.json'
      - 'web/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Gradle Wrapper and Permissions
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generating gradlew wrapper..."
            gradle wrapper --gradle-version 9.3.1 || true
          fi
          if [ -f "gradlew" ]; then
            chmod +x gradlew || true
          fi

      - name: Prepare environment and keystore
        run: |
          touch .env
          if [ ! -f .env.example ]; then touch .env.example; fi
          # Sign with the committed key so every build installs over the previous one
          if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore for APK signing..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew testDebugUnitTest --continue || true
          else
            gradle testDebugUnitTest --continue || true
          fi

      # Pushes build the release APK, signed with the secret release key (the key file and its
      # password live only in the RELEASE_KEYSTORE_* secrets). Pull requests get no secrets,
      # so they build a debug APK just to check that the code compiles.
      - name: Prepare release keystore
        if: github.event_name != 'pull_request'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then TASK=assembleDebug; else TASK=assembleRelease; fi
          if [ -f "./gradlew" ]; then
            ./gradlew $TASK --stacktrace
          else
            gradle $TASK --stacktrace
          fi

      - name: Prepare APK Artifacts
        run: |
          mkdir -p build-artifacts
          if [ "${{ github.event_name }}" = "pull_request" ]; then VARIANT=debug; else VARIANT=release; fi
          cp "app/build/outputs/apk/$VARIANT/app-$VARIANT.apk" build-artifacts/dvor-parking.apk
          rm -f "$RUNNER_TEMP/release.jks"
          echo "Built APK files:"
          ls -lh build-artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dvor-parking-apk
          path: build-artifacts/dvor-parking.apk
          if-no-files-found: error
          retention-days: 30

      # Copy of every main build in minin3418/Parking-apk (needs APK_REPO_TOKEN with
      # Contents: write on that repo; skipped while the secret is not set)
      - name: Prepare APK repo release info
        id: apkrel
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          APK_REPO_TOKEN: ${{ secrets.APK_REPO_TOKEN }}
        run: |
          if [ -z "$APK_REPO_TOKEN" ]; then
            echo "APK_REPO_TOKEN is not set - skipping publish to Parking-apk"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          {
            echo "body<<EOF"
            git log -1 --format='%s%n%n%b'
            echo "Commit: https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish APK to Parking-apk
        if: steps.apkrel.outputs.enabled == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: minin3418/Parking-apk
          token: ${{ secrets.APK_REPO_TOKEN }}
          tag_name: build-${{ github.run_number }}
          name: Версия 1.${{ github.run_number }} (${{ steps.apkrel.outputs.short_sha }})
          body: ${{ steps.apkrel.outputs.body }}
          files: build-artifacts/dvor-parking.apk
          make_latest: 'true'

      - name: Release APK on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/dvor-parking.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
