name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Prepare environment files
        run: |
          touch .env
          if [ ! -f .env.example ]; then touch .env.example; fi

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename and verify APK
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/dvor-parking.apk
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/dvor-parking-debug.apk
          echo "APK successfully built:"
          ls -lh build-artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dvor-parking-apk
          path: build-artifacts/dvor-parking.apk
          if-no-files-found: error
          retention-days: 30

      - name: Release APK (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/dvor-parking.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
